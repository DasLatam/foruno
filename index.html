<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForUno — la Fórmula 1 en telemetría</title>
<meta name="description" content="Mirá cualquier sesión de Fórmula 1 sobre el trazado real del circuito: posiciones en vivo, intervalos, microsectores y los campeonatos de pilotos y escuderías.">
<meta property="og:title" content="ForUno — la Fórmula 1 en telemetría">
<meta property="og:description" content="Cada sesión de F1 sobre el trazado real del circuito, con intervalos y microsectores.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header id="barra">
  <a class="marca" href="#/calendario">
    <span class="logo">F1</span>
    <span class="nombre">ForUno</span>
  </a>

  <nav id="nav">
    <a href="#/vivo" data-vista="vivo" class="nav-vivo" id="navVivo">
      <span class="punto-vivo"></span>VIVO<span class="cuenta" id="navCuenta"></span>
    </a>
    <a href="#/calendario" data-vista="calendario">Calendario</a>
    <a href="#/pilotos"    data-vista="pilotos">Pilotos</a>
    <a href="#/equipos"    data-vista="equipos">Escuderías</a>
  </nav>

  <div class="derecha">
    <select id="temporada" title="Temporada"></select>
  </div>
</header>

<main id="vista"></main>

<div id="carga" class="carga oculto">
  <div class="caja">
    <h2 id="cargaTitulo">Cargando</h2>
    <p id="cargaMsg">…</p>
    <div class="barra-prog"><div id="cargaBarra"></div></div>
  </div>
</div>

<template id="tpl-visor">
  <div class="visor-cab">
    <a class="volver" href="#/calendario" title="Volver al calendario">←</a>
    <div class="vc-tit"><strong class="vc-gp"></strong><span class="vc-ses"></span></div>
    <div class="paneles" role="group" aria-label="Qué mostrar">
      <button data-panel="pista" class="activo">Circuito</button>
      <button data-panel="tabla">Tabla</button>
    </div>
    <select class="vc-salto" title="Saltar a otra sesión"></select>
  </div>
  <section class="visor">
    <aside class="tabla">
      <div class="tabla-cab">
        <span>#</span><span>Piloto</span><span class="der">Intervalo</span><span class="der">Líder</span><span class="der">Última</span>
      </div>
      <ol class="filas"></ol>
      <div class="leyenda">
        <span class="lg"><i class="sw verde"></i>mejoró</span>
        <span class="lg"><i class="sw violeta"></i>mejor de la sesión</span>
        <span class="lg"><i class="sw amarillo"></i>sin mejorar</span>
        <span class="lg"><i class="sw pit"></i>boxes</span>
      </div>
    </aside>
    <div class="pista">
      <canvas class="lienzo"></canvas>
      <div class="avisos"></div>
      <div class="reloj"></div>
      <button class="toggle-seg" title="Mostrar u ocultar las barras de microsectores sobre la pista">microsectores</button>
    </div>
  </section>
  <footer class="repro">
    <button class="play icono" title="Reproducir o pausar (espacio)">▶</button>
    <div class="tiempo"><span class="t-act">0:00</span> / <span class="t-tot">0:00</span></div>
    <input type="range" class="scrub" min="0" max="1000" value="0" step="1">
    <div class="velocidades">
      <button data-vel="1" class="vel activa">1×</button>
      <button data-vel="2" class="vel">2×</button>
      <button data-vel="4" class="vel">4×</button>
      <button data-vel="10" class="vel">10×</button>
    </div>
  </footer>
</template>

<template id="tpl-vivo">
  <div class="visor-cab">
    <span class="chapa-vivo"><span class="punto-vivo"></span>EN VIVO</span>
    <div class="vc-tit"><strong class="vc-gp"></strong><span class="vc-ses"></span></div>
    <span class="marcador"><b class="mk-vuelta"></b><span class="mk-reloj"></span></span>
    <span class="estado-vivo"></span>
    <div class="paneles" role="group" aria-label="Qué mostrar">
      <button data-panel="pista" class="activo">Circuito</button>
      <button data-panel="tabla">Tabla</button>
    </div>
    <button class="btn-relato" title="Relato de radio con la voz del navegador">🔊 Relato</button>
  </div>
  <section class="visor">
    <aside class="tabla tabla-vivo">
      <div class="tabla-cab"><span>#</span><span>Piloto</span><span class="der">Intervalo</span><span class="der">Líder</span><span class="der">Última</span></div>
      <ol class="filas"></ol>
      <div class="leyenda">
        <span class="lg"><i class="sw rojo"></i>a menos de 0,3 s: sobrepaso a la vista</span>
        <span class="lg"><i class="sw violeta"></i>mejor de la sesión</span>
        <span class="lg"><i class="sw verde"></i>mejoró su marca</span>
        <span class="lg"><i class="sw amarillo"></i>sin mejorar</span>
        <span class="lg" title="La F1 no publica las coordenadas GPS sin suscripción. La posición en el mapa se deduce del microsector en que va cada auto: 24 tramos por vuelta.">📍 posición estimada por microsector</span>
        <span class="error-vivo"></span>
      </div>
      <details class="cc-caja relato-caja" open hidden>
        <summary>Relato</summary>
        <div class="relato-texto"></div>
      </details>
      <details class="cc-caja radio-caja" open>
        <summary>
          <span>Radio de</span>
          <select class="radio-piloto" title="De quién escuchar las comunicaciones"></select>
          <label class="radio-auto"><input type="checkbox" class="radio-solo" checked>sola</label>
        </summary>
        <div class="radios"></div>
      </details>
      <details class="cc-caja">
        <summary>Dirección de carrera <span class="cc-ultimo"></span></summary>
        <div class="control-carrera"></div>
      </details>
    </aside>
    <div class="pista">
      <canvas class="lienzo"></canvas>
      <div class="banda-pista"></div>
      <div class="alertas"></div>
    </div>
  </section>
</template>

<script src="/vivo.js"></script>
<script src="/relator.js"></script>
<script src="/visor.js"></script>
<script src="/app.js"></script>
</body>
</html>
